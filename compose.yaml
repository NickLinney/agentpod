services:
  agentpod:
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    user: "10001:10001"
    depends_on:
      - agentpod
    ports:
      - "127.0.0.1:3000:3000"
