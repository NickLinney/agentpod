services:
  agentpod:
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agentpod_internal
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    user: "10001:10001"
    depends_on:
      - agentpod
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - agentpod_internal
  ollama:
    image: ollama/ollama@sha256:ede6aa60166d4a630b09c158c99a3cdba9a4202a82690394af106c2b121fa721
    command: ["serve"]
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      - "../Runtime Data/models/ollama:/root/.ollama:ro"
    networks:
      - agentpod_internal

networks:
  agentpod_internal:
    internal: true
